# 节点配置示例（Clash 格式）
# 仅作格式参考，请替换为真实可用节点

proxies:
  - name: "示例节点-1"
    type: vless
    server: example.com
    port: 443
    uuid: 00000000-0000-0000-0000-000000000000
    network: tcp
    tls: true
    udp: true
    flow: xtls-rprx-vision
    servername: example.com

  - name: "示例节点-2"
    type: vmess
    server: example.com
    port: 443
    uuid: 00000000-0000-0000-0000-000000000000
    alterId: 0
    cipher: auto
    network: ws
    tls: true
    udp: true

# 使用说明：
# 1. 把上面的示例替换成真实节点信息
# 2. 导入到 Clash / Mihomo 客户端
# 3. 免费节点请勿用于重要业务
